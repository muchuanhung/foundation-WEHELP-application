<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登入系統</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page">
      <div class="login-card">
        <header class="login-card__header">
          <p class="login-card__header-text">歡迎光臨，請輸入信箱密碼</p>
        </header>

        <form
          id="login-form"
          class="login-form"
          method="post"
          action="/login"
        >
          <h1 class="login-form__title">登入系統</h1>

          <div class="login-form__row">
            <label class="login-form__label" for="email">信箱</label>
            <input
              id="email"
              type="email"
              name="email"
              class="login-form__input"
              autocomplete="email"
            />
          </div>

          <div class="login-form__row">
            <label class="login-form__label" for="password">密碼</label>
            <input
              id="password"
              type="password"
              name="password"
              class="login-form__input"
              autocomplete="current-password"
            />
          </div>

          <label class="login-form__checkbox">
            <span>同意條款</span>
            <input type="checkbox" id="agree" name="agree" />
          </label>

          <button type="submit" class="login-form__button">登入</button>
        </form>

        <section class="hotel-search">
          <h2 class="hotel-search__title">取得旅館資訊</h2>

          <div class="login-form__row">
            <label class="login-form__label" for="hotel-id">編號</label>
            <input
              id="hotel-id"
              type="text"
              class="login-form__input"
            />
          </div>

          <button type="button" id="hotel-btn" class="login-form__button">
            取得
          </button>
        </section>
      </div>
    </main>

    <script>
      const form = document.getElementById("login-form");
      const agree = document.getElementById("agree");

      form.addEventListener("submit", function (event) {
        if (!agree.checked) {
          event.preventDefault();
          alert("請勾選同意條款");
        }
      });

      const hotelBtn = document.getElementById("hotel-btn");
      const hotelIdInput = document.getElementById("hotel-id");

      hotelBtn.addEventListener("click", function () {
        const value = hotelIdInput.value.trim();
        const num = Number(value);

        if (!Number.isInteger(num) || num <= 0) {
          alert("請輸入正整數");
          return;
        }

        window.location.href = `/hotel/${num}`;
      });
    </script>
  </body>
</html>
