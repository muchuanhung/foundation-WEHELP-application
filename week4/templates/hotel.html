<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>旅館資訊</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page">
      <div class="login-card">
        <header class="login-card__header">
          <p class="login-card__header-text">旅館的資訊</p>
        </header>

        <section class="result-page">
          {% if found %}
          <p class="result-page__message">
            {{ hotel.chinese_name }}、{{ hotel.english_name }}、{{ hotel.phone }}
          </p>
          {% else %}
          <p class="result-page__message">查詢不到相關資料</p>
          {% endif %}
          <a class="result-page__link" href="/">返回首頁</a>
        </section>
      </div>
    </main>
  </body>
</html>
