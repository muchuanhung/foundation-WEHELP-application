<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>會員頁</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page">
      <div class="card">
        <header class="card__header">
          <p class="card__header-text">歡迎光臨，這是會員頁</p>
        </header>

        <section class="result-page">
          <p class="result-page__message">{{ name }}，歡迎登入系統</p>
          <a class="result-page__link" href="/logout">登出系統</a>
        </section>

        <section class="form-section mcp-section">
          <h2 class="form-section__title">MCP 伺服器設定</h2>
          <p class="mcp-section__hint">
            請使用 http://127.0.0.1:8000/mcp/ 網址<br />
            點擊產生 Token 取得金鑰
          </p>
          <button type="button" id="generate-token" class="form-button">
            產生 Token
          </button>
          <p id="token-display" class="mcp-section__token"></p>
        </section>

        <section class="form-section message-form">
          <h2 class="form-section__title">快來留言吧</h2>
          <form id="message-form">
            <div class="form-row">
              <label class="form-label" for="message-content">內容</label>
              <input
                id="message-content"
                class="form-input"
                type="text"
                name="content"
                autocomplete="off"
              />
            </div>
            <button type="submit" class="form-button">送出</button>
          </form>
        </section>

        <ul id="message-list" class="message-list"></ul>
      </div>
    </main>

    <script src="/static/member.js"></script>
  </body>
</html>
